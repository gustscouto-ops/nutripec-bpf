# Render Blueprint: Dashboard → New → Blueprint → escolha este repositório.
# Versão de TESTE (planos grátis, fábricas de demonstração). Para produção: planos pagos, disco em /data,
# tire SEED_DEMO e preencha EMPRESA_* e ADMIN_* (veja o README).
services:
  - type: web
    name: nutripec-bpf
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./Dockerfile
    healthCheckPath: /login
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: nutripec-db
          property: connectionString
      - key: SEED_DEMO
        value: "1"
      - key: AUTH_SECRET
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
databases:
  - name: nutripec-db
    plan: free
    region: virginia
    postgresMajorVersion: "16"
